<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Background -->
  <rect width="900" height="460" fill="#111827"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#F9FAFB">EAS Update — Canales y Flujo OTA</text>

  <!-- ============ LEFT: Developer side ============ -->
  <rect x="20" y="56" width="200" height="340" rx="12" fill="#0F172A" stroke="#6366F1" stroke-width="2"/>
  <text x="120" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#A5B4FC">Developer</text>

  <!-- Branch main -->
  <rect x="38" y="92" width="164" height="40" rx="8" fill="#1E293B" stroke="#4B5563" stroke-width="1"/>
  <text x="120" y="108" text-anchor="middle" font-size="12" fill="#F1F5F9">branch: main</text>
  <text x="120" y="122" text-anchor="middle" font-size="10" fill="#64748B">git push origin main</text>

  <!-- eas update staging -->
  <rect x="38" y="148" width="164" height="56" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="120" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#C4B5FD">eas update</text>
  <text x="120" y="181" text-anchor="middle" font-size="10" fill="#C4B5FD">--channel staging</text>
  <text x="120" y="195" text-anchor="middle" font-size="9" fill="#64748B">--message "fix: ..."</text>

  <!-- eas update production -->
  <rect x="38" y="220" width="164" height="56" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
  <text x="120" y="239" text-anchor="middle" font-size="11" font-weight="600" fill="#6EE7B7">eas update</text>
  <text x="120" y="253" text-anchor="middle" font-size="10" fill="#6EE7B7">--channel production</text>
  <text x="120" y="267" text-anchor="middle" font-size="9" fill="#64748B">--message "feat: ..."</text>

  <!-- rollback -->
  <rect x="38" y="292" width="164" height="44" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="120" y="311" text-anchor="middle" font-size="11" font-weight="600" fill="#FCA5A5">rollback</text>
  <text x="120" y="326" text-anchor="middle" font-size="9" fill="#64748B">eas update:roll-back-to-embedded</text>

  <!-- Label: runtime check -->
  <text x="120" y="374" text-anchor="middle" font-size="10" fill="#475569">runtimeVersion policy:</text>
  <text x="120" y="388" text-anchor="middle" font-size="10" fill="#818CF8">sdkVersion</text>

  <!-- ============ CENTER: Expo CDN ============ -->
  <rect x="270" y="56" width="200" height="340" rx="12" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
  <text x="370" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#FCD34D">Expo CDN</text>
  <text x="370" y="93" text-anchor="middle" font-size="10" fill="#64748B">u.expo.dev / EAS Update</text>

  <!-- Channel staging -->
  <rect x="288" y="110" width="164" height="90" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="370" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#C4B5FD">Canal: staging</text>
  <text x="295" y="150" font-size="10" fill="#94A3B8">• Update v3 (último)</text>
  <text x="295" y="164" font-size="10" fill="#64748B">• Update v2</text>
  <text x="295" y="178" font-size="10" fill="#64748B">• Update v1</text>
  <text x="295" y="192" font-size="9" fill="#475569">JS bundle + assets</text>

  <!-- Channel production -->
  <rect x="288" y="218" width="164" height="90" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
  <text x="370" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#6EE7B7">Canal: production</text>
  <text x="295" y="258" font-size="10" fill="#94A3B8">• Update v2 (último)</text>
  <text x="295" y="272" font-size="10" fill="#64748B">• Update v1</text>
  <text x="295" y="300" font-size="9" fill="#475569">Solo recibe updates</text>
  <text x="295" y="312" font-size="9" fill="#475569">con mismo runtimeVersion</text>

  <!-- runtime legend -->
  <rect x="288" y="326" width="164" height="50" rx="6" fill="#1E293B" stroke="#374151" stroke-width="1"/>
  <text x="370" y="344" text-anchor="middle" font-size="10" font-weight="600" fill="#F59E0B">runtimeVersion: 53.0.0</text>
  <text x="370" y="358" text-anchor="middle" font-size="9" fill="#64748B">Build y Update deben coincidir</text>
  <text x="370" y="370" text-anchor="middle" font-size="9" fill="#64748B">para que el update sea aceptado</text>

  <!-- ============ RIGHT: Devices ============ -->
  <rect x="520" y="56" width="360" height="340" rx="12" fill="#0F172A" stroke="#60A5FA" stroke-width="2"/>
  <text x="700" y="78" text-anchor="middle" font-size="13" font-weight="700" fill="#93C5FD">Dispositivos</text>

  <!-- Build preview → staging -->
  <rect x="538" y="96" width="154" height="80" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="615" y="116" text-anchor="middle" font-size="11" font-weight="600" fill="#C4B5FD">Build: preview</text>
  <rect x="545" y="124" width="140" height="20" rx="4" fill="#2D1B69"/>
  <text x="615" y="137" text-anchor="middle" font-size="9" fill="#A78BFA">channel: "staging"</text>
  <text x="615" y="163" text-anchor="middle" font-size="9" fill="#64748B">Testers internos (~10 personas)</text>
  <text x="615" y="175" text-anchor="middle" font-size="9" fill="#64748B">Recibe updates de canal staging</text>

  <!-- Build production → production -->
  <rect x="538" y="194" width="154" height="80" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
  <text x="615" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#6EE7B7">Build: production</text>
  <rect x="545" y="222" width="140" height="20" rx="4" fill="#0C2A1E"/>
  <text x="615" y="235" text-anchor="middle" font-size="9" fill="#34D399">channel: "production"</text>
  <text x="615" y="261" text-anchor="middle" font-size="9" fill="#64748B">Usuarios de App Store / Play</text>
  <text x="615" y="273" text-anchor="middle" font-size="9" fill="#64748B">Reciben updates de canal production</text>

  <!-- Update flow note -->
  <rect x="538" y="292" width="154" height="80" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="615" y="312" text-anchor="middle" font-size="10" font-weight="600" fill="#FCD34D">Protocolo de update</text>
  <text x="545" y="328" font-size="9" fill="#94A3B8">1. App abre → verifica CDN</text>
  <text x="545" y="342" font-size="9" fill="#94A3B8">2. Hay update? Descarga background</text>
  <text x="545" y="356" font-size="9" fill="#94A3B8">3. Próximo restart → activa bundle</text>
  <text x="545" y="369" font-size="9" fill="#64748B">Tiempo: &lt; 30 seg en WiFi</text>

  <!-- eas.json note right -->
  <rect x="706" y="96" width="154" height="136" rx="8" fill="#1E293B" stroke="#4B5563" stroke-width="1"/>
  <text x="783" y="116" text-anchor="middle" font-size="11" font-weight="600" fill="#F1F5F9">eas.json</text>
  <text x="720" y="134" font-size="9" fill="#94A3B8">"build": {</text>
  <text x="720" y="148" font-size="9" fill="#A78BFA">  "preview": {</text>
  <text x="720" y="160" font-size="9" fill="#C4B5FD">    "channel": "staging"</text>
  <text x="720" y="172" font-size="9" fill="#94A3B8">  },</text>
  <text x="720" y="186" font-size="9" fill="#34D399">  "production": {</text>
  <text x="720" y="198" font-size="9" fill="#6EE7B7">    "channel": "production"</text>
  <text x="720" y="210" font-size="9" fill="#94A3B8">  }</text>
  <text x="720" y="222" font-size="9" fill="#94A3B8">}</text>

  <!-- eas.json updates note -->
  <rect x="706" y="248" width="154" height="124" rx="8" fill="#1E293B" stroke="#4B5563" stroke-width="1"/>
  <text x="783" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#F1F5F9">app.json</text>
  <text x="720" y="286" font-size="9" fill="#94A3B8">"updates": {</text>
  <text x="720" y="300" font-size="9" fill="#60A5FA">  "url": "https://u.expo.dev/</text>
  <text x="720" y="312" font-size="9" fill="#60A5FA">  &lt;PROJECT_ID&gt;"</text>
  <text x="720" y="326" font-size="9" fill="#94A3B8">},</text>
  <text x="720" y="340" font-size="9" fill="#94A3B8">"runtimeVersion": {</text>
  <text x="720" y="354" font-size="9" fill="#FCD34D">  "policy": "sdkVersion"</text>
  <text x="720" y="366" font-size="9" fill="#94A3B8">}</text>

  <!-- Arrows Dev → CDN -->
  <line x1="220" y1="175" x2="268" y2="155" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <line x1="220" y1="248" x2="268" y2="262" stroke="#34D399" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>

  <!-- Arrows CDN → Devices -->
  <line x1="452" y1="155" x2="518" y2="135" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <line x1="452" y1="265" x2="518" y2="235" stroke="#34D399" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>

  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Bottom note -->
  <text x="450" y="443" text-anchor="middle" font-size="11" fill="#475569">Los canales actúan como separación de ambientes: staging para QA, production para usuarios finales</text>
</svg>
