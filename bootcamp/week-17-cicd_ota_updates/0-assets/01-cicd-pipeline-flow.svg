<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Roboto, system-ui, sans-serif">
  <!-- Background -->
  <rect width="900" height="480" fill="#111827"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#F9FAFB">Pipeline CI/CD — GitHub Actions + EAS</text>

  <!-- ============ TRIGGER ============ -->
  <rect x="20" y="60" width="140" height="56" rx="10" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
  <text x="90" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#A5B4FC">Developer</text>
  <text x="90" y="102" text-anchor="middle" font-size="11" fill="#818CF8">git push main</text>

  <!-- Arrow 1 -->
  <line x1="160" y1="88" x2="200" y2="88" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4B5563"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34D399"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#FBBF24"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#60A5FA"/>
    </marker>
  </defs>

  <!-- ============ GitHub Actions box ============ -->
  <rect x="200" y="44" width="280" height="260" rx="12" fill="#0F172A" stroke="#6366F1" stroke-width="2"/>
  <text x="340" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#A5B4FC">GitHub Actions Runner</text>
  <text x="340" y="80" text-anchor="middle" font-size="10" fill="#64748B">ubuntu-latest</text>

  <!-- Step 1 -->
  <rect x="218" y="90" width="244" height="36" rx="6" fill="#1E293B" stroke="#4B5563" stroke-width="1"/>
  <text x="238" y="106" font-size="12" fill="#94A3B8">1. actions/checkout@v4</text>
  <text x="238" y="119" font-size="10" fill="#64748B">Clonar repositorio en el runner</text>

  <!-- Step 2 -->
  <rect x="218" y="134" width="244" height="36" rx="6" fill="#1E293B" stroke="#4B5563" stroke-width="1"/>
  <text x="238" y="150" font-size="12" fill="#94A3B8">2. setup-node + npm install</text>
  <text x="238" y="163" font-size="10" fill="#64748B">Instalar dependencias con caché</text>

  <!-- Step 3 -->
  <rect x="218" y="178" width="244" height="36" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
  <text x="238" y="194" font-size="12" fill="#FCA5A5">3. tsc --noEmit (TypeCheck)</text>
  <text x="238" y="207" font-size="10" fill="#64748B">Falla el pipeline si hay errores</text>

  <!-- Step 4 -->
  <rect x="218" y="222" width="244" height="36" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="238" y="238" font-size="12" fill="#6EE7B7">4. expo/expo-github-action@v8</text>
  <text x="238" y="251" font-size="10" fill="#64748B">EXPO_TOKEN → autentica con Expo</text>

  <!-- Step 5 -->
  <rect x="218" y="266" width="244" height="32" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
  <text x="238" y="282" font-size="12" fill="#FCD34D">5. eas build / eas update</text>
  <text x="238" y="295" font-size="10" fill="#64748B">Encola build o publica OTA</text>

  <!-- Arrow GH → Expo servers -->
  <line x1="480" y1="180" x2="530" y2="180" stroke="#34D399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="490" y="172" font-size="9" fill="#6EE7B7">eas build</text>

  <!-- ============ Expo Build Servers ============ -->
  <rect x="530" y="90" width="180" height="120" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="2"/>
  <text x="620" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#6EE7B7">Expo Build Servers</text>

  <rect x="548" y="122" width="144" height="32" rx="6" fill="#1E293B" stroke="#60A5FA" stroke-width="1"/>
  <text x="620" y="138" text-anchor="middle" font-size="11" fill="#93C5FD">macOS → .ipa (iOS)</text>
  <text x="620" y="150" text-anchor="middle" font-size="9" fill="#64748B">firma con certificados Apple</text>

  <rect x="548" y="162" width="144" height="32" rx="6" fill="#1E293B" stroke="#34D399" stroke-width="1"/>
  <text x="620" y="178" text-anchor="middle" font-size="11" fill="#6EE7B7">Linux → .aab (Android)</text>
  <text x="620" y="190" text-anchor="middle" font-size="9" fill="#64748B">firma con keystore</text>

  <!-- Arrow Expo → Stores -->
  <line x1="620" y1="212" x2="620" y2="250" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Stores box -->
  <rect x="540" y="250" width="160" height="52" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="620" y="270" text-anchor="middle" font-size="11" font-weight="600" fill="#FCD34D">eas submit</text>
  <text x="620" y="285" text-anchor="middle" font-size="10" fill="#94A3B8">App Store / Google Play</text>
  <text x="620" y="296" text-anchor="middle" font-size="9" fill="#64748B">(opcional, automático)</text>

  <!-- ============ OTA path ============ -->
  <!-- Arrow GH → OTA -->
  <line x1="480" y1="280" x2="530" y2="340" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="480" y="330" font-size="9" fill="#A78BFA">eas update</text>

  <rect x="530" y="318" width="180" height="52" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
  <text x="620" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#C4B5FD">Expo CDN (OTA)</text>
  <text x="620" y="355" text-anchor="middle" font-size="10" fill="#94A3B8">JS bundle distribuido</text>
  <text x="620" y="367" text-anchor="middle" font-size="9" fill="#64748B">sin pasar por tiendas</text>

  <!-- Arrow OTA → Users -->
  <line x1="620" y1="370" x2="620" y2="400" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="540" y="400" width="160" height="48" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="620" y="421" text-anchor="middle" font-size="11" font-weight="600" fill="#C4B5FD">Dispositivos</text>
  <text x="620" y="436" text-anchor="middle" font-size="10" fill="#94A3B8">expo-updates verifica</text>
  <text x="620" y="447" text-anchor="middle" font-size="9" fill="#64748B">y aplica automáticamente</text>

  <!-- ============ Secrets note ============ -->
  <rect x="20" y="350" width="170" height="84" rx="8" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="105" y="372" text-anchor="middle" font-size="12" font-weight="700" fill="#FCA5A5">Secrets de GitHub</text>
  <line x1="40" y1="378" x2="170" y2="378" stroke="#374151" stroke-width="1"/>
  <text x="40" y="394" font-size="11" fill="#94A3B8">EXPO_TOKEN</text>
  <text x="40" y="408" font-size="9" fill="#64748B">expo.dev → Account → Tokens</text>
  <text x="40" y="425" font-size="11" fill="#94A3B8">APPLE_ID (opcional)</text>
  <text x="40" y="438" font-size="9" fill="#64748B">para auto-submit iOS</text>

  <!-- Bottom note -->
  <text x="450" y="466" text-anchor="middle" font-size="11" fill="#475569">El runner de GitHub Actions solo lanza el comando — el build ocurre en servidores de Expo</text>
</svg>
