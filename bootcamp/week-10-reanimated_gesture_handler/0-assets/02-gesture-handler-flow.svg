<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <rect width="900" height="480" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="34" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#f1f5f9" text-anchor="middle">Gesture Handler — Ciclo de vida y tipos de gesto</text>

  <!-- ─── Gesture lifecycle ─── -->
  <text x="30" y="62" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#61DAFB">CICLO DE VIDA DE UN GESTO</text>

  <!-- States row -->
  <!-- onBegin -->
  <rect x="30" y="72" width="120" height="60" rx="8" fill="#1e293b"/>
  <text x="90" y="96" font-family="monospace" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">onBegin</text>
  <text x="90" y="114" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">primer contacto</text>

  <!-- arrow -->
  <line x1="150" y1="102" x2="180" y2="102" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- onUpdate -->
  <rect x="182" y="72" width="130" height="60" rx="8" fill="#1e293b"/>
  <text x="247" y="96" font-family="monospace" font-size="11" font-weight="700" fill="#61DAFB" text-anchor="middle">onUpdate</text>
  <text x="247" y="114" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">mientras se mueve</text>

  <!-- arrow -->
  <line x1="312" y1="102" x2="342" y2="102" stroke="#475569" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- onEnd / onFinalize -->
  <rect x="344" y="72" width="130" height="60" rx="8" fill="#1e293b"/>
  <text x="409" y="91" font-family="monospace" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">onEnd</text>
  <text x="409" y="107" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">onFinalize</text>
  <text x="409" y="124" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">al soltar</text>

  <!-- event data box -->
  <rect x="510" y="58" width="360" height="86" rx="8" fill="#1e293b"/>
  <text x="690" y="78" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#f1f5f9" text-anchor="middle">Datos del evento (Pan)</text>
  <text x="524" y="97" font-family="monospace" font-size="10" fill="#fbbf24">translationX</text>
  <text x="680" y="97" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#94a3b8">px desde onBegin en X</text>
  <text x="524" y="113" font-family="monospace" font-size="10" fill="#fbbf24">translationY</text>
  <text x="680" y="113" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#94a3b8">px desde onBegin en Y</text>
  <text x="524" y="129" font-family="monospace" font-size="10" fill="#fbbf24">velocityX / velocityY</text>
  <text x="680" y="129" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#94a3b8">px/s al soltar</text>

  <!-- ─── Three gesture types ─── -->
  <text x="30" y="168" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#61DAFB">TIPOS DE GESTO</text>

  <!-- TAP -->
  <rect x="30" y="178" width="260" height="140" rx="8" fill="#1e293b"/>
  <text x="160" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">Gesture.Tap()</text>
  <text x="44" y="220" font-family="monospace" font-size="9" fill="#94a3b8">.onBegin(() =&gt; {</text>
  <text x="56" y="234" font-family="monospace" font-size="9" fill="#fbbf24">  scale.value = withSpring(0.9);</text>
  <text x="44" y="248" font-family="monospace" font-size="9" fill="#94a3b8">})</text>
  <text x="44" y="262" font-family="monospace" font-size="9" fill="#94a3b8">.onFinalize(() =&gt; {</text>
  <text x="56" y="276" font-family="monospace" font-size="9" fill="#fbbf24">  scale.value = withSpring(1);</text>
  <text x="44" y="290" font-family="monospace" font-size="9" fill="#94a3b8">})</text>
  <text x="44" y="310" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b">Toque puntual — onUpdate no aplica</text>

  <!-- PAN -->
  <rect x="306" y="178" width="270" height="180" rx="8" fill="#1e293b"/>
  <text x="441" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle">Gesture.Pan()</text>
  <text x="320" y="220" font-family="monospace" font-size="9" fill="#94a3b8">.onUpdate((e) =&gt; {</text>
  <text x="332" y="234" font-family="monospace" font-size="9" fill="#fbbf24">  x.value = e.translationX;</text>
  <text x="332" y="248" font-family="monospace" font-size="9" fill="#fbbf24">  y.value = e.translationY;</text>
  <text x="320" y="262" font-family="monospace" font-size="9" fill="#94a3b8">})</text>
  <text x="320" y="276" font-family="monospace" font-size="9" fill="#94a3b8">.onEnd(() =&gt; {</text>
  <text x="332" y="290" font-family="monospace" font-size="9" fill="#fbbf24">  x.value = withSpring(0);</text>
  <text x="332" y="304" font-family="monospace" font-size="9" fill="#fbbf24">  y.value = withSpring(0);</text>
  <text x="320" y="318" font-family="monospace" font-size="9" fill="#94a3b8">})</text>
  <text x="320" y="348" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b">Arrastrar — e.translationX/Y</text>

  <!-- PINCH -->
  <rect x="592" y="178" width="278" height="180" rx="8" fill="#1e293b"/>
  <text x="731" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#fb923c" text-anchor="middle">Gesture.Pinch()</text>
  <text x="606" y="220" font-family="monospace" font-size="9" fill="#94a3b8">.onUpdate((e) =&gt; {</text>
  <text x="618" y="234" font-family="monospace" font-size="9" fill="#fbbf24">  scale.value =</text>
  <text x="630" y="248" font-family="monospace" font-size="9" fill="#fbbf24">    saved.value * e.scale;</text>
  <text x="606" y="262" font-family="monospace" font-size="9" fill="#94a3b8">})</text>
  <text x="606" y="276" font-family="monospace" font-size="9" fill="#94a3b8">.onEnd(() =&gt; {</text>
  <text x="618" y="290" font-family="monospace" font-size="9" fill="#fbbf24">  saved.value = scale.value;</text>
  <text x="606" y="304" font-family="monospace" font-size="9" fill="#94a3b8">})</text>
  <text x="606" y="348" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b">Zoom con dos dedos — e.scale</text>

  <!-- ─── Bottom: runOnJS + GestureHandlerRootView ─── -->
  <!-- runOnJS box -->
  <rect x="30" y="380" width="420" height="84" rx="8" fill="#1e293b"/>
  <text x="240" y="400" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#fb923c" text-anchor="middle">runOnJS — cruzar de UI thread a JS thread</text>
  <text x="44" y="418" font-family="monospace" font-size="10" fill="#94a3b8">.onEnd(() =&gt; {</text>
  <text x="56" y="432" font-family="monospace" font-size="10" fill="#fbbf24">  runOnJS(setDragging)(false); // ← setState React</text>
  <text x="44" y="446" font-family="monospace" font-size="10" fill="#94a3b8">})</text>
  <text x="44" y="460" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b">Usar solo para actualizar estado JS. Tiene costo de sincronización.</text>

  <!-- GestureHandlerRootView box -->
  <rect x="466" y="380" width="404" height="84" rx="8" fill="#1e293b"/>
  <text x="668" y="400" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#f97316" text-anchor="middle">⚠️ Configuración obligatoria</text>
  <text x="480" y="418" font-family="monospace" font-size="10" fill="#fbbf24">&lt;GestureHandlerRootView style={{ flex: 1 }}&gt;</text>
  <text x="492" y="432" font-family="monospace" font-size="10" fill="#94a3b8">  &lt;App /&gt;</text>
  <text x="480" y="446" font-family="monospace" font-size="10" fill="#fbbf24">&lt;/GestureHandlerRootView&gt;</text>
  <text x="480" y="460" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b">Obligatorio en App.tsx — crash en Android sin esto</text>

  <defs>
    <marker id="arr2" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
