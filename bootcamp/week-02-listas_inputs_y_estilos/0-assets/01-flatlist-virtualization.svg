<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" width="820" height="500" role="img" aria-labelledby="title desc">
  <title id="title">FlatList Virtualization</title>
  <desc id="desc">Diagrama comparativo: ScrollView renderiza todos los items en memoria; FlatList solo renderiza los items visibles en pantalla más un buffer pequeño.</desc>

  <!-- Background -->
  <rect width="820" height="500" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="410" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#e6edf3" text-anchor="middle">Virtualización de Listas en React Native</text>

  <!-- ===== LEFT: ScrollView ===== -->
  <!-- Panel -->
  <rect x="40" y="60" width="340" height="400" fill="#161b22" rx="10" stroke="#30363d" stroke-width="1"/>
  <!-- Panel title -->
  <text x="210" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#f85149" text-anchor="middle">ScrollView</text>
  <text x="210" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Renderiza TODOS los items en memoria</text>

  <!-- Phone frame -->
  <rect x="110" y="120" width="200" height="310" fill="#0d1117" rx="16" stroke="#30363d" stroke-width="2"/>
  <!-- Screen area -->
  <rect x="120" y="135" width="180" height="220" fill="#0d1117" rx="6" stroke="#21262d" stroke-width="1"/>
  <!-- Visible label -->
  <text x="210" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">pantalla visible</text>

  <!-- Items in ScrollView — all rendered, some outside viewport -->
  <!-- Visible items (inside screen) -->
  <rect x="128" y="143" width="164" height="32" fill="#1a3a4a" rx="4" stroke="#61DAFB" stroke-width="1"/>
  <text x="210" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#61DAFB" text-anchor="middle">Item 1 ✓ en DOM</text>

  <rect x="128" y="181" width="164" height="32" fill="#1a3a4a" rx="4" stroke="#61DAFB" stroke-width="1"/>
  <text x="210" y="201" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#61DAFB" text-anchor="middle">Item 2 ✓ en DOM</text>

  <rect x="128" y="219" width="164" height="32" fill="#1a3a4a" rx="4" stroke="#61DAFB" stroke-width="1"/>
  <text x="210" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#61DAFB" text-anchor="middle">Item 3 ✓ en DOM</text>

  <rect x="128" y="257" width="164" height="32" fill="#1a3a4a" rx="4" stroke="#61DAFB" stroke-width="1"/>
  <text x="210" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#61DAFB" text-anchor="middle">Item 4 ✓ en DOM</text>

  <!-- Screen bottom boundary line -->
  <line x1="120" y1="355" x2="300" y2="355" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Items outside viewport (below screen) — still rendered -->
  <rect x="128" y="297" width="164" height="32" fill="#3d1a1a" rx="4" stroke="#f85149" stroke-width="1"/>
  <text x="210" y="317" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f85149" text-anchor="middle">Item 5 ✗ fuera de vista</text>

  <rect x="128" y="335" width="164" height="32" fill="#3d1a1a" rx="4" stroke="#f85149" stroke-width="1"/>
  <text x="210" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f85149" text-anchor="middle">Item 6 ✗ fuera de vista</text>

  <!-- Dots indicating more items -->
  <text x="210" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#f85149" text-anchor="middle">···</text>
  <text x="210" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#f85149" text-anchor="middle">500 items más en memoria</text>

  <!-- Memory badge -->
  <rect x="120" y="425" width="180" height="24" fill="#3d1a1a" rx="4"/>
  <text x="210" y="441" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#f85149" text-anchor="middle">⚠ RAM: alta — todos renderizados</text>

  <!-- ===== RIGHT: FlatList ===== -->
  <!-- Panel -->
  <rect x="440" y="60" width="340" height="400" fill="#161b22" rx="10" stroke="#30363d" stroke-width="1"/>
  <!-- Panel title -->
  <text x="610" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#3fb950" text-anchor="middle">FlatList</text>
  <text x="610" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Solo renderiza los items visibles + buffer</text>

  <!-- Phone frame -->
  <rect x="510" y="120" width="200" height="310" fill="#0d1117" rx="16" stroke="#30363d" stroke-width="2"/>
  <!-- Screen area -->
  <rect x="520" y="135" width="180" height="220" fill="#0d1117" rx="6" stroke="#21262d" stroke-width="1"/>
  <!-- Visible label -->
  <text x="610" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#8b949e" text-anchor="middle">pantalla visible</text>

  <!-- Visible items in FlatList (rendered) -->
  <rect x="528" y="143" width="164" height="32" fill="#1a3a2a" rx="4" stroke="#3fb950" stroke-width="1"/>
  <text x="610" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3fb950" text-anchor="middle">Item 1 ✓ renderizado</text>

  <rect x="528" y="181" width="164" height="32" fill="#1a3a2a" rx="4" stroke="#3fb950" stroke-width="1"/>
  <text x="610" y="201" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3fb950" text-anchor="middle">Item 2 ✓ renderizado</text>

  <rect x="528" y="219" width="164" height="32" fill="#1a3a2a" rx="4" stroke="#3fb950" stroke-width="1"/>
  <text x="610" y="239" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3fb950" text-anchor="middle">Item 3 ✓ renderizado</text>

  <rect x="528" y="257" width="164" height="32" fill="#1a3a2a" rx="4" stroke="#3fb950" stroke-width="1"/>
  <text x="610" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#3fb950" text-anchor="middle">Item 4 ✓ renderizado</text>

  <!-- Screen bottom boundary line -->
  <line x1="520" y1="355" x2="700" y2="355" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Items outside viewport (recycled / not in DOM) -->
  <rect x="528" y="297" width="164" height="32" fill="#21262d" rx="4" stroke="#484f58" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="610" y="317" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#484f58" text-anchor="middle">Item 5 — reciclado</text>

  <rect x="528" y="335" width="164" height="32" fill="#21262d" rx="4" stroke="#484f58" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="610" y="355" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#484f58" text-anchor="middle">Item 6 — reciclado</text>

  <!-- Placeholder for far items -->
  <text x="610" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#484f58" text-anchor="middle">···</text>
  <text x="610" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#484f58" text-anchor="middle">500 items — solo datos en memoria</text>

  <!-- Memory badge -->
  <rect x="520" y="425" width="180" height="24" fill="#1a3a2a" rx="4"/>
  <text x="610" y="441" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#3fb950" text-anchor="middle">✓ RAM: eficiente — virtualizado</text>

  <!-- Arrow in middle -->
  <text x="410" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#30363d" text-anchor="middle">→</text>

  <!-- Footer caption -->
  <text x="410" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#484f58" text-anchor="middle">Usa FlatList para listas de más de ~15 items dinámicos</text>
</svg>
