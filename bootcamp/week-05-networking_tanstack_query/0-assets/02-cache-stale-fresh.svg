<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500" role="img" aria-labelledby="title02 desc02">
  <title id="title02">Estados del caché: fresh, stale y gcTime</title>
  <desc id="desc02">Diagrama que compara los estados fresh y stale del caché de TanStack Query, explicando staleTime y gcTime con línea de tiempo.</desc>

  <!-- Background -->
  <rect width="860" height="500" fill="#0d1117"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Estados del Caché: fresh · stale · inactive</text>
  <text x="430" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">staleTime controla cuándo refrescar. gcTime controla cuándo eliminar del caché.</text>

  <!-- ── TIMELINE ───────────────────────────────────────────── -->
  <!-- Timeline base -->
  <line x1="60" y1="160" x2="800" y2="160" stroke="#30363d" stroke-width="2"/>
  <!-- Tick marks -->
  <line x1="60" y1="155" x2="60" y2="165" stroke="#484f58" stroke-width="1.5"/>
  <line x1="260" y1="155" x2="260" y2="165" stroke="#484f58" stroke-width="1.5"/>
  <line x1="560" y1="155" x2="560" y2="165" stroke="#484f58" stroke-width="1.5"/>
  <line x1="760" y1="155" x2="760" y2="165" stroke="#484f58" stroke-width="1.5"/>

  <!-- Timeline labels -->
  <text x="60" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">fetch done</text>
  <text x="260" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">staleTime</text>
  <text x="560" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">unmount</text>
  <text x="760" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">gcTime</text>

  <!-- FRESH zone -->
  <rect x="60" y="110" width="200" height="40" rx="4" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-width="1.5"/>
  <text x="160" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3fb950">FRESH</text>

  <!-- STALE zone -->
  <rect x="260" y="110" width="300" height="40" rx="4" fill="#d29922" fill-opacity="0.15" stroke="#d29922" stroke-width="1.5"/>
  <text x="410" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#d29922">STALE</text>

  <!-- INACTIVE zone (after unmount) -->
  <rect x="560" y="110" width="200" height="40" rx="4" fill="#8b949e" fill-opacity="0.15" stroke="#8b949e" stroke-width="1.5"/>
  <text x="660" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8b949e">INACTIVE</text>

  <!-- DELETED -->
  <rect x="760" y="110" width="80" height="40" rx="4" fill="#f85149" fill-opacity="0.1" stroke="#f85149" stroke-width="1"/>
  <text x="800" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f85149">GC</text>

  <!-- ── BEHAVIOUR CARDS ────────────────────────────────────── -->

  <!-- FRESH card -->
  <rect x="30" y="210" width="240" height="120" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="150" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3fb950">FRESH</text>
  <text x="150" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">Al remontar el componente:</text>
  <text x="150" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3fb950">NO hay refetch</text>
  <text x="150" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Usa el caché directamente</text>
  <text x="150" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#484f58">isLoading = false, isFetching = false</text>
  <text x="150" y="326" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#61DAFB">staleTime: 5 * 60 * 1000 (5 min)</text>

  <!-- STALE card -->
  <rect x="310" y="210" width="240" height="120" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="430" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#d29922">STALE</text>
  <text x="430" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">Al remontar el componente:</text>
  <text x="430" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#d29922">Muestra caché + refetch en BG</text>
  <text x="430" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">UX sin parpadeo de loading</text>
  <text x="430" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#484f58">isLoading = false, isFetching = true</text>
  <text x="430" y="326" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#61DAFB">staleTime: 0 (default)</text>

  <!-- INACTIVE card -->
  <rect x="590" y="210" width="240" height="120" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
  <text x="710" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#8b949e">INACTIVE</text>
  <text x="710" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">Sin componentes suscritos:</text>
  <text x="710" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Caché persiste gcTime más</text>
  <text x="710" y="288" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Al remontar: muestra caché + refetch</text>
  <text x="710" y="306" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#484f58">Útil para navegación atrás/adelante</text>
  <text x="710" y="326" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#61DAFB">gcTime: 5 * 60 * 1000 (default)</text>

  <!-- ── CODE EXAMPLE ───────────────────────────────────────── -->
  <rect x="30" y="355" width="800" height="120" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="50" y="378" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b949e">// Configuración por QueryClient (global) o por query individual</text>
  <text x="50" y="398" font-family="monospace, monospace" font-size="12" fill="#61DAFB">const queryClient</text>
  <text x="182" y="398" font-family="monospace, monospace" font-size="12" fill="#e6edf3"> = new QueryClient({</text>
  <text x="50" y="416" font-family="monospace, monospace" font-size="12" fill="#e6edf3">  defaultOptions: { queries: {</text>
  <text x="50" y="434" font-family="monospace, monospace" font-size="12" fill="#d29922">    staleTime</text>
  <text x="142" y="434" font-family="monospace, monospace" font-size="12" fill="#e6edf3">: 1000 * 60 * 5,  </text>
  <text x="340" y="434" font-family="monospace, monospace" font-size="12" fill="#484f58">// 5 min → datos fresh por 5 min</text>
  <text x="50" y="452" font-family="monospace, monospace" font-size="12" fill="#d29922">    gcTime</text>
  <text x="130" y="452" font-family="monospace, monospace" font-size="12" fill="#e6edf3">: 1000 * 60 * 10, </text>
  <text x="340" y="452" font-family="monospace, monospace" font-size="12" fill="#484f58">// 10 min → eliminar caché 10 min tras desmontar</text>
  <text x="50" y="470" font-family="monospace, monospace" font-size="12" fill="#e6edf3">  } },</text>
  <text x="50" y="458" font-family="monospace, monospace" font-size="12" fill="#e6edf3">});</text>
</svg>
