<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" role="img" aria-labelledby="title01 desc01">
  <title id="title01">Ciclo de vida de TanStack Query</title>
  <desc id="desc01">Diagrama que muestra el flujo completo de una query: mount → fetch → cache → stale → refetch, con los estados isLoading, isFetching, isError y isSuccess.</desc>

  <!-- Background -->
  <rect width="860" height="520" fill="#0d1117"/>

  <!-- Title -->
  <text x="430" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Ciclo de Vida de TanStack Query</text>
  <text x="430" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">Desde el montaje del componente hasta la actualización del caché</text>

  <!-- ── STEP BOXES ─────────────────────────────────────────── -->

  <!-- Step 1: Component mounts -->
  <rect x="30" y="90" width="140" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="100" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Componente</text>
  <text x="100" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">se monta</text>
  <text x="100" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">useQuery()</text>

  <!-- Arrow 1→2 -->
  <line x1="170" y1="120" x2="208" y2="120" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: Check cache -->
  <rect x="210" y="90" width="140" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="280" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">¿Hay caché</text>
  <text x="280" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">disponible?</text>
  <text x="280" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">queryKey lookup</text>

  <!-- NO branch - isLoading -->
  <text x="314" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#f85149">NO</text>
  <line x1="350" y1="150" x2="350" y2="192" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrRed)"/>

  <!-- YES branch - stale check -->
  <text x="362" y="113" font-family="system-ui, sans-serif" font-size="11" fill="#3fb950">SÍ</text>
  <line x1="350" y1="120" x2="388" y2="120" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrGreen)"/>

  <!-- Step 3a: isLoading (NO branch) -->
  <rect x="278" y="195" width="140" height="54" rx="8" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
  <text x="348" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f85149">isLoading</text>
  <text x="348" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">true</text>
  <text x="348" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#484f58">data = undefined</text>

  <!-- Arrow from isLoading to fetch -->
  <line x1="418" y1="222" x2="452" y2="222" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3b: stale check (YES branch) -->
  <rect x="390" y="90" width="140" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="460" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">¿Datos</text>
  <text x="460" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">stale?</text>
  <text x="460" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">staleTime check</text>

  <!-- Stale YES → isFetching BG -->
  <text x="540" y="113" font-family="system-ui, sans-serif" font-size="11" fill="#d29922">SÍ</text>
  <line x1="530" y1="120" x2="568" y2="120" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrYellow)"/>

  <!-- isFetching background box -->
  <rect x="570" y="90" width="150" height="60" rx="8" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="645" y="114" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#d29922">isFetching</text>
  <text x="645" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">true (background)</text>
  <text x="645" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#484f58">data = caché anterior</text>

  <!-- Step 4: queryFn execution -->
  <rect x="455" y="195" width="150" height="54" rx="8" fill="#161b22" stroke="#61DAFB" stroke-width="1.5"/>
  <text x="530" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#61DAFB">queryFn()</text>
  <text x="530" y="234" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">axios.get('/items')</text>
  <text x="530" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#484f58">Promise en vuelo</text>

  <!-- Arrow fetch → success/error fork -->
  <line x1="530" y1="249" x2="530" y2="292" stroke="#30363d" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 5a: isSuccess -->
  <rect x="390" y="295" width="140" height="70" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="460" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3fb950">isSuccess</text>
  <text x="460" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">data = response</text>
  <text x="460" y="353" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#484f58">caché actualizado</text>

  <!-- Step 5b: isError -->
  <rect x="570" y="295" width="140" height="70" rx="8" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
  <text x="640" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f85149">isError</text>
  <text x="640" y="337" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">error = AxiosError</text>
  <text x="640" y="353" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#484f58">retry count check</text>

  <!-- Fork arrows from queryFn -->
  <line x1="490" y1="295" x2="475" y2="295" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrGreen)"/>
  <line x1="570" y1="295" x2="585" y2="295" stroke="#f85149" stroke-width="1.5" marker-end="url(#arrRed)"/>

  <!-- Step 6: Stale after staleTime -->
  <rect x="278" y="390" width="180" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="368" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">Datos stale</text>
  <text x="368" y="431" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">tras staleTime (5 min)</text>
  <text x="368" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#484f58">esperando trigger</text>

  <!-- Arrow success → stale -->
  <line x1="460" y1="365" x2="420" y2="390" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Refetch triggers -->
  <rect x="30" y="390" width="220" height="60" rx="8" fill="#161b22" stroke="#61DAFB" stroke-width="1"/>
  <text x="140" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#61DAFB">Triggers de refetch</text>
  <text x="140" y="428" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">window focus · network reconnect</text>
  <text x="140" y="444" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">refetch() · invalidateQueries()</text>

  <!-- Arrow triggers → stale check -->
  <line x1="250" y1="420" x2="278" y2="420" stroke="#61DAFB" stroke-width="1.5" marker-end="url(#arrBlue)"/>

  <!-- Arrow retry from isError -->
  <path d="M 710 330 Q 780 330 780 250 Q 780 200 630 200 L 607 200" fill="none" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="790" y="270" text-anchor="start" font-family="system-ui, sans-serif" font-size="11" fill="#f85149">retry</text>

  <!-- ── LEGEND ─────────────────────────────────────────────── -->
  <rect x="570" y="395" width="250" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="695" y="414" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8b949e">LEYENDA</text>
  <line x1="586" y1="430" x2="616" y2="430" stroke="#3fb950" stroke-width="2"/>
  <text x="622" y="434" font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">Camino exitoso</text>
  <line x1="586" y1="450" x2="616" y2="450" stroke="#f85149" stroke-width="2"/>
  <text x="622" y="454" font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">Camino de error</text>
  <line x1="586" y1="470" x2="616" y2="470" stroke="#d29922" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="622" y="474" font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">Background fetch</text>
  <line x1="586" y1="490" x2="616" y2="490" stroke="#61DAFB" stroke-width="2"/>
  <text x="622" y="494" font-family="system-ui, sans-serif" font-size="11" fill="#e6edf3">Trigger / acción</text>

  <!-- ── ARROW MARKERS ─────────────────────────────────────── -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#30363d"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f85149"/>
    </marker>
    <marker id="arrYellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d29922"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#61DAFB"/>
    </marker>
  </defs>
</svg>
