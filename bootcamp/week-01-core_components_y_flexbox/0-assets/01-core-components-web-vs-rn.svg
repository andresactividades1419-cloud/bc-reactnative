<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="title2 desc2">
  <title id="title2">Core Components de React Native vs HTML</title>
  <desc id="desc2">Tabla comparativa de componentes HTML equivalentes en React Native: div→View, p/span→Text, img→Image, ul/li→FlatList, input→TextInput.</desc>

  <!-- Fondo -->
  <rect width="800" height="560" fill="#0d1117"/>

  <!-- Título -->
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Core Components: HTML → React Native</text>
  <text x="400" y="62" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">No existe el DOM en React Native — cada componente compila a UI nativa</text>

  <!-- Cabecera tabla -->
  <rect x="40" y="80" width="340" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="210" y="107" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#f97316">HTML / CSS (web)</text>

  <rect x="420" y="80" width="340" height="44" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="590" y="107" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#61DAFB">React Native</text>

  <!-- Flecha central -->
  <text x="400" y="107" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#30363d">→</text>

  <!-- Fila 1: div → View -->
  <rect x="40" y="136" width="340" height="64" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="210" y="160" text-anchor="middle" font-family="monospace" font-size="15" fill="#e06c75">&lt;div&gt;</text>
  <text x="210" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Contenedor genérico</text>

  <text x="400" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#30363d">→</text>

  <rect x="420" y="136" width="340" height="64" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="590" y="160" text-anchor="middle" font-family="monospace" font-size="15" fill="#61DAFB">&lt;View&gt;</text>
  <text x="590" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Contenedor Flexbox nativo</text>

  <!-- Fila 2: p, span, h1 → Text -->
  <rect x="40" y="212" width="340" height="64" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="210" y="236" text-anchor="middle" font-family="monospace" font-size="15" fill="#e06c75">&lt;p&gt;  &lt;span&gt;  &lt;h1&gt;</text>
  <text x="210" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Elementos de texto</text>

  <text x="400" y="248" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#30363d">→</text>

  <rect x="420" y="212" width="340" height="64" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="590" y="236" text-anchor="middle" font-family="monospace" font-size="15" fill="#61DAFB">&lt;Text&gt;</text>
  <text x="590" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Todo texto va dentro de Text</text>

  <!-- Fila 3: img → Image -->
  <rect x="40" y="288" width="340" height="64" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="210" y="312" text-anchor="middle" font-family="monospace" font-size="15" fill="#e06c75">&lt;img src="..."&gt;</text>
  <text x="210" y="332" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Imagen (URL o local)</text>

  <text x="400" y="324" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#30363d">→</text>

  <rect x="420" y="288" width="340" height="64" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="590" y="308" text-anchor="middle" font-family="monospace" font-size="15" fill="#61DAFB">&lt;Image source={{uri}}&gt;</text>
  <text x="590" y="328" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Requiere width y height explícitos</text>

  <!-- Fila 4: ul/li → FlatList -->
  <rect x="40" y="364" width="340" height="64" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="210" y="388" text-anchor="middle" font-family="monospace" font-size="15" fill="#e06c75">&lt;ul&gt; + &lt;li&gt;</text>
  <text x="210" y="408" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Lista de elementos (renderiza todos)</text>

  <text x="400" y="400" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#30363d">→</text>

  <rect x="420" y="364" width="340" height="64" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="590" y="388" text-anchor="middle" font-family="monospace" font-size="15" fill="#61DAFB">&lt;FlatList&gt;</text>
  <text x="590" y="408" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Virtualizada — solo renderiza lo visible</text>

  <!-- Fila 5: input → TextInput -->
  <rect x="40" y="440" width="340" height="64" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="210" y="464" text-anchor="middle" font-family="monospace" font-size="15" fill="#e06c75">&lt;input type="text"&gt;</text>
  <text x="210" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">Campo de texto</text>

  <text x="400" y="476" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#30363d">→</text>

  <rect x="420" y="440" width="340" height="64" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
  <text x="590" y="464" text-anchor="middle" font-family="monospace" font-size="15" fill="#61DAFB">&lt;TextInput&gt;</text>
  <text x="590" y="484" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#8b949e">onChangeText en lugar de onChange</text>

  <!-- Nota footer -->
  <rect x="40" y="516" width="720" height="30" rx="6" fill="#161b22"/>
  <text x="400" y="535" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">Semana 01 — Fundamentos RN  |  React Native 0.79+  |  Expo SDK 53+</text>
</svg>
