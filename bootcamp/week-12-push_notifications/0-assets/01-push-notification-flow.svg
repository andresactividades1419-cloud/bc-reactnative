<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" style="font-family: Inter, Roboto, sans-serif;">
  <!-- Background -->
  <rect width="900" height="500" fill="#111827"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#F9FAFB" font-size="17" font-weight="700">Flujo Completo — Push Notification con Expo</text>

  <!-- === ROW 1: App side === -->

  <!-- Box: Tu App -->
  <rect x="30" y="70" width="140" height="60" rx="8" fill="#1F2937" stroke="#61DAFB" stroke-width="1.5"/>
  <text x="100" y="96" text-anchor="middle" fill="#61DAFB" font-size="12" font-weight="700">Tu App</text>
  <text x="100" y="113" text-anchor="middle" fill="#9CA3AF" font-size="10">(Expo Go / Dev Build)</text>

  <!-- Arrow: App → Permissions -->
  <line x1="170" y1="100" x2="210" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box: Request Permissions -->
  <rect x="210" y="70" width="155" height="60" rx="8" fill="#1F2937" stroke="#6366F1" stroke-width="1.5"/>
  <text x="287" y="94" text-anchor="middle" fill="#6366F1" font-size="11" font-weight="700">requestPermissions</text>
  <text x="287" y="110" text-anchor="middle" fill="#9CA3AF" font-size="10">Async()</text>
  <text x="287" y="124" text-anchor="middle" fill="#9CA3AF" font-size="9">iOS obligatorio</text>

  <!-- Arrow: Permissions → getExpoPushToken -->
  <line x1="365" y1="100" x2="405" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box: getExpoPushTokenAsync -->
  <rect x="405" y="70" width="165" height="60" rx="8" fill="#1F2937" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="487" y="94" text-anchor="middle" fill="#F59E0B" font-size="11" font-weight="700">getExpoPushToken</text>
  <text x="487" y="110" text-anchor="middle" fill="#F59E0B" font-size="11" font-weight="700">Async({ projectId })</text>
  <text x="487" y="124" text-anchor="middle" fill="#9CA3AF" font-size="9">Solo dispositivo físico</text>

  <!-- Arrow: Token → Tu Backend -->
  <line x1="570" y1="100" x2="615" y2="100" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Box: Tu Backend -->
  <rect x="615" y="70" width="130" height="60" rx="8" fill="#1F2937" stroke="#10B981" stroke-width="1.5"/>
  <text x="680" y="94" text-anchor="middle" fill="#10B981" font-size="12" font-weight="700">Tu Backend</text>
  <text x="680" y="111" text-anchor="middle" fill="#9CA3AF" font-size="10">Guarda el token</text>
  <text x="680" y="124" text-anchor="middle" fill="#9CA3AF" font-size="9">por usuario/device</text>

  <!-- Arrow: Backend → Expo Push API (down) -->
  <line x1="680" y1="130" x2="680" y2="185" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Label: POST payload -->
  <text x="700" y="163" fill="#9CA3AF" font-size="9">POST payload</text>

  <!-- === ROW 2: Middle — Expo Push API === -->

  <!-- Box: Expo Push API -->
  <rect x="560" y="185" width="240" height="65" rx="8" fill="#1F2937" stroke="#61DAFB" stroke-width="2"/>
  <text x="680" y="209" text-anchor="middle" fill="#61DAFB" font-size="13" font-weight="700">Expo Push API</text>
  <text x="680" y="227" text-anchor="middle" fill="#9CA3AF" font-size="10">exp.host/--/api/v2/push/send</text>
  <text x="680" y="242" text-anchor="middle" fill="#9CA3AF" font-size="9">Intermediario → FCM y APNs</text>

  <!-- Arrow: Expo Push API → FCM -->
  <line x1="600" y1="250" x2="440" y2="310" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="495" y="282" fill="#F87171" font-size="9">Android</text>

  <!-- Arrow: Expo Push API → APNs -->
  <line x1="760" y1="250" x2="760" y2="310" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="770" y="290" fill="#93C5FD" font-size="9">iOS</text>

  <!-- === ROW 3: FCM / APNs === -->

  <!-- Box: FCM Google -->
  <rect x="310" y="310" width="180" height="65" rx="8" fill="#1F2937" stroke="#F87171" stroke-width="1.5"/>
  <text x="400" y="334" text-anchor="middle" fill="#F87171" font-size="12" font-weight="700">FCM</text>
  <text x="400" y="350" text-anchor="middle" fill="#9CA3AF" font-size="10">Firebase Cloud Messaging</text>
  <text x="400" y="365" text-anchor="middle" fill="#9CA3AF" font-size="9">Google — Android</text>

  <!-- Box: APNs Apple -->
  <rect x="635" y="310" width="180" height="65" rx="8" fill="#1F2937" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="725" y="334" text-anchor="middle" fill="#93C5FD" font-size="12" font-weight="700">APNs</text>
  <text x="725" y="350" text-anchor="middle" fill="#9CA3AF" font-size="10">Apple Push Notification</text>
  <text x="725" y="365" text-anchor="middle" fill="#9CA3AF" font-size="9">service — iOS</text>

  <!-- Arrow: FCM → Device Android -->
  <line x1="400" y1="375" x2="320" y2="435" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow: APNs → Device iOS -->
  <line x1="725" y1="375" x2="725" y2="435" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- === ROW 4: Devices === -->

  <!-- Device Android -->
  <rect x="200" y="435" width="150" height="50" rx="8" fill="#1F2937" stroke="#F87171" stroke-width="1.5"/>
  <text x="275" y="456" text-anchor="middle" fill="#F9FAFB" font-size="11" font-weight="700">Dispositivo Android</text>
  <text x="275" y="473" text-anchor="middle" fill="#9CA3AF" font-size="9">Notificación recibida</text>

  <!-- Device iOS -->
  <rect x="625" y="435" width="150" height="50" rx="8" fill="#1F2937" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="700" y="456" text-anchor="middle" fill="#F9FAFB" font-size="11" font-weight="700">Dispositivo iOS</text>
  <text x="700" y="473" text-anchor="middle" fill="#9CA3AF" font-size="9">Notificación recibida</text>

  <!-- Token label on first arrow -->
  <text x="185" y="92" fill="#9CA3AF" font-size="9">permisos</text>

  <!-- ExponentPushToken label -->
  <text x="370" y="92" fill="#F59E0B" font-size="8">granted</text>

  <!-- Send token label -->
  <text x="573" y="92" fill="#10B981" font-size="8">token</text>

  <!-- Expo Push Token display box (left side) -->
  <rect x="30" y="185" width="260" height="55" rx="6" fill="#0F172A" stroke="#374151" stroke-width="1"/>
  <text x="44" y="206" fill="#9CA3AF" font-size="9">Token generado:</text>
  <text x="44" y="221" fill="#F59E0B" font-size="9" font-family="monospace">ExponentPushToken[abc123...]</text>
  <text x="44" y="234" fill="#9CA3AF" font-size="9">Único por app + dispositivo</text>

  <!-- Arrow from token info to Expo Push API (label only, conceptual) -->

  <!-- Legend -->
  <rect x="30" y="420" width="155" height="65" rx="6" fill="#0F172A" stroke="#374151" stroke-width="1"/>
  <text x="44" y="440" fill="#9CA3AF" font-size="9" font-weight="700">Leyenda</text>
  <rect x="44" y="449" width="8" height="8" fill="#61DAFB"/>
  <text x="58" y="458" fill="#9CA3AF" font-size="8">Expo SDK / API</text>
  <rect x="44" y="462" width="8" height="8" fill="#F87171"/>
  <text x="58" y="471" fill="#9CA3AF" font-size="8">Google / Android</text>
  <rect x="44" y="475" width="8" height="8" fill="#93C5FD"/>
  <text x="58" y="484" fill="#9CA3AF" font-size="8">Apple / iOS</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4B5563"/>
    </marker>
  </defs>
</svg>
