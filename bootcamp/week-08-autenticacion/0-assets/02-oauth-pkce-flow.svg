<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <rect width="900" height="520" fill="#0f172a"/>

  <!-- Title -->
  <text x="450" y="36" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#f1f5f9" text-anchor="middle">OAuth 2.0 PKCE Flow — Expo AuthSession</text>

  <!-- Actors -->
  <!-- App -->
  <rect x="30" y="60" width="110" height="40" rx="6" fill="#1e3a5f"/>
  <text x="85" y="85" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#61DAFB" text-anchor="middle">📱 App</text>
  <line x1="85" y1="100" x2="85" y2="490" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Browser -->
  <rect x="230" y="60" width="130" height="40" rx="6" fill="#1e3a5f"/>
  <text x="295" y="85" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#a78bfa" text-anchor="middle">🌐 WebBrowser</text>
  <line x1="295" y1="100" x2="295" y2="490" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- OAuth Provider -->
  <rect x="450" y="60" width="150" height="40" rx="6" fill="#1e3a5f"/>
  <text x="525" y="85" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fb923c" text-anchor="middle">🏢 OAuth Provider</text>
  <line x1="525" y1="100" x2="525" y2="490" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Backend Server -->
  <rect x="700" y="60" width="150" height="40" rx="6" fill="#1e3a5f"/>
  <text x="775" y="85" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#4ade80" text-anchor="middle">🖥️ Tu Backend</text>
  <line x1="775" y1="100" x2="775" y2="490" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Step 1: Generate PKCE -->
  <rect x="0" y="108" width="26" height="18" rx="3" fill="#334155"/>
  <text x="13" y="121" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">1</text>
  <rect x="30" y="118" width="220" height="20" rx="3" fill="#1e293b"/>
  <text x="140" y="131" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">expo-crypto: genera code_verifier → code_challenge (SHA256)</text>

  <!-- Step 2: promptAsync → open browser -->
  <rect x="0" y="150" width="26" height="18" rx="3" fill="#334155"/>
  <text x="13" y="163" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">2</text>
  <line x1="85" y1="158" x2="285" y2="158" stroke="#a78bfa" stroke-width="2" marker-end="url(#pkce-arrow-purple)"/>
  <rect x="110" y="144" width="150" height="20" rx="3" fill="#0f172a"/>
  <text x="185" y="157" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">promptAsync() abre WebBrowser</text>

  <!-- Step 3: Auth request to provider -->
  <rect x="0" y="186" width="26" height="18" rx="3" fill="#334155"/>
  <text x="13" y="199" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">3</text>
  <line x1="295" y1="194" x2="515" y2="194" stroke="#fb923c" stroke-width="2" marker-end="url(#pkce-arrow-orange)"/>
  <rect x="300" y="180" width="210" height="20" rx="3" fill="#0f172a"/>
  <text x="405" y="193" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">GET /authorize?code_challenge=...&amp;scope=...</text>

  <!-- Step 4: User grants permission -->
  <rect x="0" y="222" width="26" height="18" rx="3" fill="#334155"/>
  <text x="13" y="235" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">4</text>
  <rect x="440" y="222" width="170" height="20" rx="3" fill="#1e293b"/>
  <text x="525" y="235" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#fb923c" text-anchor="middle">Usuario se autentica y autoriza</text>

  <!-- Step 5: Redirect with code -->
  <rect x="0" y="258" width="26" height="18" rx="3" fill="#334155"/>
  <text x="13" y="271" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">5</text>
  <line x1="515" y1="266" x2="305" y2="266" stroke="#fb923c" stroke-width="2" marker-end="url(#pkce-arrow-orange-left)"/>
  <rect x="320" y="252" width="180" height="20" rx="3" fill="#0f172a"/>
  <text x="410" y="265" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">redirect: scheme://&amp;code=AUTH_CODE</text>

  <!-- Step 6: Deep link back to app -->
  <rect x="0" y="294" width="26" height="18" rx="3" fill="#334155"/>
  <text x="13" y="307" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">6</text>
  <line x1="285" y1="302" x2="95" y2="302" stroke="#a78bfa" stroke-width="2" marker-end="url(#pkce-arrow-purple-left)"/>
  <rect x="110" y="288" width="150" height="20" rx="3" fill="#0f172a"/>
  <text x="185" y="301" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">response: { type: 'success', code }</text>

  <!-- Step 7: Send code to backend -->
  <rect x="0" y="330" width="26" height="18" rx="3" fill="#334155"/>
  <text x="13" y="343" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">7</text>
  <line x1="85" y1="338" x2="765" y2="338" stroke="#4ade80" stroke-width="2" marker-end="url(#pkce-arrow-green)"/>
  <rect x="350" y="324" width="230" height="20" rx="3" fill="#0f172a"/>
  <text x="465" y="337" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">POST /auth/callback { code, code_verifier }</text>

  <!-- Step 8: Backend exchanges code -->
  <rect x="0" y="366" width="26" height="18" rx="3" fill="#334155"/>
  <text x="13" y="379" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">8</text>
  <line x1="775" y1="374" x2="535" y2="374" stroke="#fb923c" stroke-width="2" marker-end="url(#pkce-arrow-orange-left)"/>
  <rect x="570" y="360" width="180" height="20" rx="3" fill="#0f172a"/>
  <text x="660" y="373" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">POST /token { code + code_verifier }</text>

  <!-- Step 9: Provider validates PKCE -->
  <rect x="0" y="402" width="26" height="18" rx="3" fill="#334155"/>
  <text x="13" y="415" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">9</text>
  <rect x="440" y="402" width="170" height="20" rx="3" fill="#1e293b"/>
  <text x="525" y="415" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#fb923c" text-anchor="middle">Verifica SHA256(verifier)===challenge</text>

  <!-- Step 10: Provider returns token to backend -->
  <rect x="0" y="430" width="26" height="18" rx="3" fill="#334155"/>
  <text x="13" y="443" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">10</text>
  <line x1="535" y1="440" x2="765" y2="440" stroke="#fb923c" stroke-width="2" marker-end="url(#pkce-arrow-orange)"/>
  <rect x="570" y="426" width="170" height="20" rx="3" fill="#0f172a"/>
  <text x="655" y="439" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#e2e8f0" text-anchor="middle">{ access_token, user_info }</text>

  <!-- Step 11: Backend returns JWT to App -->
  <rect x="0" y="466" width="26" height="18" rx="3" fill="#334155"/>
  <text x="13" y="479" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">11</text>
  <line x1="765" y1="474" x2="95" y2="474" stroke="#4ade80" stroke-width="2" marker-end="url(#pkce-arrow-green-left)"/>
  <rect x="340" y="460" width="200" height="20" rx="3" fill="#0f172a"/>
  <text x="440" y="473" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#4ade80" text-anchor="middle">{ appToken } → SecureStore → Zustand</text>

  <!-- PKCE box explanation -->
  <rect x="30" y="118" width="12" height="12" rx="2" fill="#7c3aed"/>
  <rect x="30" y="118" width="220" height="1" fill="none"/>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="pkce-arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="pkce-arrow-purple-left" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="pkce-arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fb923c"/>
    </marker>
    <marker id="pkce-arrow-orange-left" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#fb923c"/>
    </marker>
    <marker id="pkce-arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
    <marker id="pkce-arrow-green-left" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M8,0 L8,6 L0,3 z" fill="#4ade80"/>
    </marker>
  </defs>
</svg>
