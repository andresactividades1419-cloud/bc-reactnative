<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg"
     font-family="'Inter','Roboto','Helvetica Neue',Arial,sans-serif">

  <!-- Background -->
  <rect width="900" height="220" fill="#0d1117"/>

  <!-- Left cyan accent bar -->
  <rect x="0" y="0" width="5" height="220" fill="#61DAFB"/>

  <!-- ================================================ -->
  <!-- REACT ATOM ICON — center (75, 108)               -->
  <!-- ================================================ -->

  <!-- Subtle glow disc behind atom -->
  <circle cx="75" cy="108" r="48" fill="#61DAFB" opacity="0.04"/>

  <!-- Orbit 1 — horizontal -->
  <ellipse cx="75" cy="108" rx="44" ry="14"
           fill="none" stroke="#61DAFB" stroke-width="2.5" opacity="0.88"/>

  <!-- Orbit 2 — rotated 60° -->
  <ellipse cx="75" cy="108" rx="44" ry="14"
           fill="none" stroke="#61DAFB" stroke-width="2.5" opacity="0.88"
           transform="rotate(60 75 108)"/>

  <!-- Orbit 3 — rotated -60° -->
  <ellipse cx="75" cy="108" rx="44" ry="14"
           fill="none" stroke="#61DAFB" stroke-width="2.5" opacity="0.88"
           transform="rotate(-60 75 108)"/>

  <!-- Nucleus -->
  <circle cx="75" cy="108" r="9" fill="#61DAFB"/>

  <!-- ================================================ -->
  <!-- TEXT CONTENT                                     -->
  <!-- ================================================ -->

  <!-- "BOOTCAMP" label -->
  <text x="145" y="62"
        font-size="12" font-weight="700" fill="#61DAFB" letter-spacing="6">BOOTCAMP</text>

  <!-- Main title -->
  <text x="143" y="120"
        font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1">React Native</text>

  <!-- Subtitle -->
  <text x="147" y="152"
        font-size="20" font-weight="400" fill="#8b949e" letter-spacing="2">Zero to Hero</text>

  <!-- Separator line -->
  <line x1="145" y1="170" x2="598" y2="170" stroke="#21262d" stroke-width="1"/>

  <!-- Stats row -->
  <text y="190" font-size="12" fill="#8b949e">
    <tspan x="145" font-weight="700" fill="#61DAFB">18</tspan>
    <tspan> semanas</tspan>
    <tspan dx="8" fill="#61DAFB" opacity="0.7">•</tspan>
    <tspan dx="8" font-weight="700" fill="#61DAFB">144</tspan>
    <tspan> horas</tspan>
    <tspan dx="8" fill="#61DAFB" opacity="0.7">•</tspan>
    <tspan dx="8">Expo SDK 53+</tspan>
    <tspan dx="8" fill="#61DAFB" opacity="0.7">•</tspan>
    <tspan dx="8">TypeScript 5.x</tspan>
    <tspan dx="8" fill="#61DAFB" opacity="0.7">•</tspan>
    <tspan dx="8">EAS Build</tspan>
  </text>

  <!-- ================================================ -->
  <!-- DECORATIVE DOTS — transition area x 598-705      -->
  <!-- ================================================ -->
  <circle cx="612" cy="38"  r="2.5" fill="#61DAFB" opacity="0.35"/>
  <circle cx="635" cy="66"  r="2"   fill="#61DAFB" opacity="0.25"/>
  <circle cx="620" cy="94"  r="3.5" fill="#61DAFB" opacity="0.18"/>
  <circle cx="655" cy="50"  r="2"   fill="#61DAFB" opacity="0.30"/>
  <circle cx="670" cy="82"  r="3"   fill="#61DAFB" opacity="0.22"/>
  <circle cx="646" cy="118" r="2"   fill="#61DAFB" opacity="0.28"/>
  <circle cx="660" cy="150" r="3.5" fill="#61DAFB" opacity="0.18"/>
  <circle cx="607" cy="160" r="2"   fill="#61DAFB" opacity="0.30"/>
  <circle cx="680" cy="130" r="2"   fill="#61DAFB" opacity="0.25"/>
  <circle cx="602" cy="78"  r="3"   fill="#61DAFB" opacity="0.20"/>
  <circle cx="640" cy="172" r="2"   fill="#61DAFB" opacity="0.20"/>
  <circle cx="664" cy="34"  r="2"   fill="#61DAFB" opacity="0.22"/>
  <circle cx="678" cy="110" r="2.5" fill="#61DAFB" opacity="0.18"/>
  <circle cx="623" cy="182" r="2"   fill="#61DAFB" opacity="0.15"/>
  <circle cx="690" cy="58"  r="2"   fill="#61DAFB" opacity="0.20"/>
  <circle cx="700" cy="142" r="2.5" fill="#61DAFB" opacity="0.15"/>

  <!-- ================================================ -->
  <!-- MOBILE PHONE SILHOUETTE — x 712-828              -->
  <!-- ================================================ -->

  <!-- Phone body outline -->
  <rect x="712" y="18" width="116" height="184" rx="17"
        fill="none" stroke="#61DAFB" stroke-width="2.5"/>

  <!-- Screen area -->
  <rect x="724" y="35" width="92" height="150" rx="3" fill="#161b22"/>

  <!-- Speaker slot -->
  <rect x="740" y="26" width="38" height="5" rx="2.5" fill="#61DAFB" opacity="0.55"/>

  <!-- Home indicator bar -->
  <rect x="746" y="191" width="48" height="4" rx="2" fill="#61DAFB" opacity="0.85"/>

  <!-- Simulated code lines on screen -->
  <!-- import / header line (cyan) -->
  <rect x="734" y="47"  width="64" height="4" rx="1.5" fill="#61DAFB" opacity="0.75"/>
  <!-- indent lines (muted) -->
  <rect x="742" y="57"  width="48" height="4" rx="1.5" fill="#8b949e" opacity="0.50"/>
  <rect x="742" y="67"  width="56" height="4" rx="1.5" fill="#8b949e" opacity="0.45"/>
  <rect x="742" y="77"  width="36" height="4" rx="1.5" fill="#8b949e" opacity="0.45"/>
  <!-- section keyword (cyan) -->
  <rect x="734" y="88"  width="58" height="4" rx="1.5" fill="#61DAFB" opacity="0.50"/>
  <!-- content lines -->
  <rect x="742" y="98"  width="46" height="4" rx="1.5" fill="#8b949e" opacity="0.50"/>
  <rect x="742" y="108" width="34" height="4" rx="1.5" fill="#8b949e" opacity="0.45"/>
  <!-- another keyword (cyan) -->
  <rect x="734" y="118" width="60" height="4" rx="1.5" fill="#61DAFB" opacity="0.45"/>
  <!-- content lines -->
  <rect x="742" y="128" width="50" height="4" rx="1.5" fill="#8b949e" opacity="0.50"/>
  <rect x="742" y="138" width="32" height="4" rx="1.5" fill="#8b949e" opacity="0.45"/>
  <!-- closing lines -->
  <rect x="734" y="148" width="44" height="4" rx="1.5" fill="#8b949e" opacity="0.40"/>
  <rect x="734" y="158" width="62" height="4" rx="1.5" fill="#61DAFB" opacity="0.40"/>
  <rect x="734" y="168" width="48" height="4" rx="1.5" fill="#8b949e" opacity="0.45"/>
  <rect x="742" y="178" width="30" height="4" rx="1.5" fill="#8b949e" opacity="0.35"/>

</svg>
